<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Sem conexão | Distribuidora Snoop</title>
    <style>
      *{box-sizing:border-box}body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;margin:0;padding:24px;background:#0b0b0b;color:#f7f7f4;font:16px/1.6 system-ui,sans-serif}main{width:min(100%,430px);padding:30px;border:1px solid #2a2a2a;border-radius:18px;background:#111;text-align:center}img{display:block;width:88px;height:88px;margin:0 auto 20px;border-radius:50%}h1{font-size:1.55rem;line-height:1.2;margin:0 0 14px}p{color:#aaa;font-size:.92rem}button{width:100%;min-height:46px;margin-top:12px;padding:12px 18px;border:0;border-radius:11px;background:#ffc400;color:#080808;font:800 .95rem system-ui,sans-serif;cursor:pointer}button:focus-visible{outline:2px solid white;outline-offset:4px}small{display:block;margin-top:18px;color:#aaa;font-size:.75rem}
    </style>
  </head>
  <body>
    <main>
      <img src="assets/logo-snoop-header.png" alt="Distribuidora Snoop" />
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para consultar os produtos ou acessar o painel com os dados atualizados.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
      <small>Pedidos e movimentações de caixa precisam de conexão para serem registrados.</small>
    </main>
  </body>
</html>
